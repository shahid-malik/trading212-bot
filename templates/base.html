<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}Trading212 Bot{% endblock %}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap">
<style>
  /* --- design-system/tokens.css --- */
  :root, [data-theme="light"] {
    color-scheme: light dark;
    --surface: #f6f8fc;
    --surface-raised: #ffffff;
    --surface-overlay: #ffffff;
    --ink: #202124;
    --ink-muted: #5f6368;
    --ink-faint: #80868b;
    --border: #dadce0;
    --border-strong: #bdc1c6;
    --brand: #1a73e8;
    --brand-hover: #1765cc;
    --brand-subtle: #e8f0fe;
    --on-brand: #ffffff;
    --success: #137333;
    --success-bg: #e6f4ea;
    --danger: #c5221f;
    --danger-bg: #fce8e6;
    --danger-solid: #c5221f;
    --on-danger-solid: #ffffff;
    --warning: #975a00;
    --warning-bg: #fef7e0;
    --neutral: #5f6368;
    --neutral-bg: #f1f3f4;
    --focus-ring: #1a73e8;
    --space-4: 4px;
    --space-8: 8px;
    --space-12: 12px;
    --space-16: 16px;
    --space-20: 20px;
    --space-24: 24px;
    --space-32: 32px;
    --space-48: 48px;
    --radius-control: 8px;
    --radius-card: 12px;
    --radius-pill: 999px;
    --shadow-resting: 0 1px 2px 0 rgba(60,64,67,0.30), 0 1px 3px 1px rgba(60,64,67,0.15);
    --shadow-raised: 0 1px 2px 0 rgba(60,64,67,0.30), 0 2px 6px 2px rgba(60,64,67,0.15);
    --font-sans: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  [data-theme="dark"] {
    --surface: #202124;
    --surface-raised: #292a2d;
    --surface-overlay: #35363a;
    --ink: #e8eaed;
    --ink-muted: #9aa0a6;
    --ink-faint: #80868b;
    --border: #3c4043;
    --border-strong: #5f6368;
    --brand: #8ab4f8;
    --brand-hover: #aecbfa;
    --brand-subtle: #28324a;
    --on-brand: #202124;
    --success: #81c995;
    --success-bg: #1c3829;
    --danger: #f28b82;
    --danger-bg: #3c1d1a;
    --danger-solid: #c5221f;
    --on-danger-solid: #ffffff;
    --warning: #fdd663;
    --warning-bg: #3d3319;
    --neutral: #9aa0a6;
    --neutral-bg: #35363a;
    --focus-ring: #8ab4f8;
    --shadow-resting: 0 1px 2px 0 rgba(0,0,0,0.45), 0 1px 3px 1px rgba(0,0,0,0.30);
    --shadow-raised: 0 1px 2px 0 rgba(0,0,0,0.50), 0 2px 6px 2px rgba(0,0,0,0.35);
  }
  body { background: var(--surface); color: var(--ink); font-family: var(--font-sans); margin: 0; }

  /* --- design-system/components.css --- */
  header {
    background: var(--surface-raised);
    border-bottom: 1px solid var(--border);
    color: var(--ink);
    padding: var(--space-12) var(--space-24);
    display: flex;
    align-items: center;
    gap: var(--space-24);
  }
  header h1 { font-size: 20px; font-weight: 600; margin: 0; color: var(--brand); }
  header nav { display: flex; gap: var(--space-8); }
  header nav a {
    color: var(--ink-muted);
    text-decoration: none;
    font-size: 14px; font-weight: 500;
    padding: var(--space-8) var(--space-16);
    border-radius: var(--radius-pill);
  }
  header nav a:hover { background: var(--neutral-bg); color: var(--ink); }
  header nav a.active { background: var(--brand-subtle); color: var(--ink); font-weight: 600; }

  table { border-collapse: collapse; width: 100%; background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-resting); overflow: hidden; }
  th, td { padding: var(--space-8) var(--space-12); text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
  th { background: var(--neutral-bg); color: var(--ink-muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; position: sticky; top: 0; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--neutral-bg); }
  td.data, th.data { font-family: var(--font-mono); font-size: 13px; font-weight: 500; }

  .badge { display: inline-block; padding: var(--space-4) var(--space-12); border-radius: var(--radius-pill); font-size: 12px; font-weight: 600; line-height: 1.4; }
  .badge-buy { background: var(--success-bg); color: var(--success); }
  .badge-sell { background: var(--danger-bg); color: var(--danger); }
  .badge-dry { background: var(--neutral-bg); color: var(--neutral); }
  .badge-fired { background: var(--success-bg); color: var(--success); }
  .badge-blocked { background: var(--neutral-bg); color: var(--neutral); }
  .badge-executed { background: var(--success-bg); color: var(--success); }
  .badge-notexec { background: var(--warning-bg); color: var(--warning); }

  input[type=checkbox] { margin-right: var(--space-4); accent-color: var(--brand); }
  .checkbox-field { display: flex; align-items: center; font-size: 14px; padding-bottom: var(--space-8); }
  .filters { display: flex; gap: var(--space-12); margin-bottom: var(--space-16); align-items: end; flex-wrap: wrap; }
  .filters label { display: block; font-size: 12px; color: var(--ink-muted); margin-bottom: var(--space-4); }

  select, input[type=number], input[type=text] {
    padding: var(--space-8) var(--space-12);
    border: 1px solid var(--border);
    border-radius: var(--radius-control);
    font-size: 14px;
    background: var(--surface-raised);
    color: var(--ink);
  }
  select:hover, input[type=number]:hover, input[type=text]:hover { border-color: var(--border-strong); }
  select:focus, input[type=number]:focus, input[type=text]:focus {
    outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-subtle);
  }

  button {
    padding: 10px var(--space-24);
    border: none;
    border-radius: var(--radius-pill);
    background: var(--brand);
    color: var(--on-brand);
    font-size: 14px; font-weight: 500;
    cursor: pointer;
  }
  button:hover { background: var(--brand-hover); }
  button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--border-strong); }
  button.secondary:hover { background: var(--neutral-bg); }
  button.destructive { background: var(--danger-solid); color: var(--on-danger-solid); }

  .card {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    padding: var(--space-20) var(--space-24);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-resting);
    margin-bottom: var(--space-24);
  }
  .card h2 { margin: 0 0 var(--space-16) 0; font-size: 16px; font-weight: 600; color: var(--ink); }

  .field-row { display: flex; justify-content: space-between; align-items: center; padding: var(--space-8) 0; gap: var(--space-16); }
  .field-row label { font-size: 14px; color: var(--ink); flex: 1; }
  .field-row input { width: 140px; text-align: right; }

  .flash-ok { background: var(--success-bg); color: var(--success); padding: var(--space-12) var(--space-16); border-radius: var(--radius-control); margin-bottom: var(--space-16); font-size: 14px; }
  .flash-err { background: var(--danger-bg); color: var(--danger); padding: var(--space-12) var(--space-16); border-radius: var(--radius-control); margin-bottom: var(--space-16); font-size: 14px; }

  .muted { color: var(--ink-muted); font-size: 12px; }
  a.rowlink { color: var(--brand); text-decoration: none; font-weight: 500; font-family: var(--font-mono); font-size: 13px; }
  a.rowlink:hover { text-decoration: underline; }

  .kv { display: grid; grid-template-columns: 220px 1fr; gap: var(--space-8) var(--space-16); font-size: 14px; }
  .kv div:nth-child(odd) { color: var(--ink-muted); }
  .kv div:nth-child(even) { font-family: var(--font-mono); font-size: 13px; }

  .scroll-x { overflow-x: auto; }

  :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

  details summary { cursor: pointer; color: var(--brand); font-weight: 600; font-size: 12px; white-space: nowrap; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: "\25B8"; display: inline-block; margin-right: var(--space-4); transition: transform .15s ease; }
  details[open] summary::before { transform: rotate(90deg); }
  .rules-breakdown { margin-top: var(--space-12); min-width: 280px; }
  .rule-group { margin-bottom: var(--space-12); }
  .rule-group strong { display: block; font-size: 12px; margin-bottom: var(--space-4); }
  .rule-group ul { margin: 0; padding-left: var(--space-16); font-size: 12px; }
  .rule-group li { list-style: none; margin-left: calc(var(--space-16) * -1); padding: 1px 0; }
  .ok-text { color: var(--success); }
  .bad-text { color: var(--danger); }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--space-12); margin-bottom: var(--space-20); }
  .kpi-card { background: var(--surface-raised); border: 1px solid var(--border); padding: var(--space-16); border-radius: var(--radius-card); box-shadow: var(--shadow-resting); }
  .kpi-label { font-size: 11px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: var(--space-4); }
  .kpi-value { font-family: var(--font-mono); font-size: 22px; font-weight: 600; color: var(--ink); }
  .kpi-value.ok-text { color: var(--success); }
  .kpi-value.bad-text { color: var(--danger); }

  /* --- layout (not part of the design system) --- */
  main { max-width: 1200px; margin: 0 auto; padding: 24px; }
</style>
</head>
<body>
<header>
  <h1>Trading212 Bot</h1>
  <nav>
    <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">Dashboard</a>
    <a href="{{ url_for('trades') }}" class="{% if request.endpoint in ['trades','trade_detail'] %}active{% endif %}">Trades</a>
    <a href="{{ url_for('decisions') }}" class="{% if request.endpoint == 'decisions' %}active{% endif %}">Decisions</a>
    <a href="{{ url_for('watchlist') }}" class="{% if request.endpoint == 'watchlist' %}active{% endif %}">Watchlist</a>
    <a href="{{ url_for('rules') }}" class="{% if request.endpoint == 'rules' %}active{% endif %}">Rules</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
